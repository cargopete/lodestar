<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lodestar — Offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #141034;
        color: #e9e6ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center; padding: 2rem; gap: 1rem;
        padding-top: max(2rem, env(safe-area-inset-top));
      }
      img { width: 84px; height: 84px; opacity: 0.92; }
      h1 { font-size: 1.4rem; margin: 0.4rem 0 0; font-weight: 650; }
      p { margin: 0; color: #9d96d6; max-width: 22rem; line-height: 1.5; }
      button {
        margin-top: 0.6rem; border: 0; cursor: pointer;
        background: #6f4cff; color: #fff;
        font-size: 1rem; font-weight: 600;
        padding: 0.75rem 1.6rem; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icons/icon-192.png" alt="Lodestar" />
      <h1>You're offline</h1>
      <p>Lodestar needs a connection to pull live data from The Graph. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
