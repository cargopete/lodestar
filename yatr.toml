# yatr task runner — wraps the npm scripts so there's one front door.
# package.json stays the source of truth; tasks just call `npm run …`.

[settings]
cache = true
watch_debounce_ms = 300

# ─────────────────────────────────────────────────────────────
# Dev
# ─────────────────────────────────────────────────────────────

[tasks.dev]
desc = "Start the Next.js dev server"
no_cache = true
run = ["npm run dev"]

# ─────────────────────────────────────────────────────────────
# Quality checks (cached on src + config changes)
# ─────────────────────────────────────────────────────────────

[tasks.lint]
desc = "ESLint"
run = ["npm run lint"]
sources = ["src/**/*", "eslint.config.mjs", "package.json"]

[tasks.type-check]
desc = "TypeScript type-check (tsc --noEmit)"
run = ["npm run type-check"]
sources = ["src/**/*", "tsconfig.json", "package.json"]

[tasks.test]
desc = "Run the Vitest suite once"
run = ["npm run test"]
sources = ["src/**/*", "vitest.config.ts", "package.json"]
watch = ["src/**/*"]

[tasks.test-coverage]
desc = "Vitest with coverage"
no_cache = true
run = ["npm run test:coverage"]

# ─────────────────────────────────────────────────────────────
# Build — deliberately uncached (Next owns its own .next/cache;
# layering yatr caching here risks resurrecting stale chunks)
# ─────────────────────────────────────────────────────────────

[tasks.build]
desc = "Production build"
no_cache = true
run = ["npm run build"]

# ─────────────────────────────────────────────────────────────
# Aggregate — the full CI gate
# ─────────────────────────────────────────────────────────────

[tasks.check]
desc = "Full check: lint + type-check + test"
depends = ["lint", "type-check", "test"]
run = []

[tasks.ci]
desc = "Full CI gate: checks then build"
depends = ["check", "build"]
run = []

# ─────────────────────────────────────────────────────────────
# Utilities
# ─────────────────────────────────────────────────────────────

[tasks.db-backfill]
desc = "Run the DB backfill script"
no_cache = true
run = ["npm run db:backfill"]
