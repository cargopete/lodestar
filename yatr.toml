# yatr - https://github.com/cargopete/yatr
#
# These tasks are what .github/workflows/ci.yml runs, command for command, so
# `yatr ci` locally is the same gate. The workflow calls these tasks by name:
# change a command here and CI changes with it.
#
# This project is pnpm, not npm: pnpm-lock.yaml is the lockfile and CI pins
# pnpm 10. Running these through npm would resolve a different tree.
#
# The aggregate is `ci`, not `check`: `yatr check` is a builtin that validates
# this file and shadows any task of that name without warning.

[settings]
cache = true

[tasks.install]
desc = "Install from the lockfile, exactly as CI does"
run = ["pnpm install --frozen-lockfile"]
sources = ["package.json", "pnpm-lock.yaml"]

[tasks.dev]
desc = "Run the Next.js dev server"
run = ["pnpm dev"]
foreground = true
no_cache = true

[tasks.lint]
desc = "ESLint (CI: lint)"
run = ["pnpm lint"]
sources = ["src/**/*", "eslint.config.mjs", "package.json"]

[tasks.type-check]
desc = "tsc --noEmit (CI: type-check)"
run = ["pnpm type-check"]
sources = ["src/**/*", "tsconfig.json"]

[tasks.test]
desc = "Vitest run"
run = ["pnpm test"]
sources = ["src/**/*", "package.json"]
watch = ["src/**/*"]

[tasks.test-coverage]
desc = "Vitest with coverage (CI: test)"
run = ["pnpm test:coverage"]
sources = ["src/**/*", "package.json"]

[tasks.build]
desc = "Next.js production build (CI: build)"
run = ["pnpm build"]
sources = ["src/**/*", "public/**/*", "next.config.ts", "pnpm-lock.yaml"]

[tasks.db-backfill]
desc = "Backfill the database"
run = ["pnpm db:backfill"]
no_cache = true

[tasks.ci]
desc = "What CI runs: lint, type-check, test-coverage, build"
depends = ["lint", "type-check", "test-coverage", "build"]
run = []
